<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Document settings: Set character encoding and viewport for responsiveness -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Title appearing in browser tab -->
    <title>Premium Tic-Tac-Toe vs Bot</title>
    
    <!-- Link to external stylesheet for design -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Premium Google Fonts integration: Outfit for headings and Poppins for main text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Background orbs: Visual elements for animated premium background styling -->
    <div class="bg-orbs">
        <div class="orb-3"></div>
    </div>

    <!-- Victory/Draw Modal: Hidden by default (via 'hide' class), shown when game ends -->
    <div class="msg-content hide">
        <p id="msg">Winner</p> <!-- Holds text showing who won or if it's a draw -->
        <button id="new-btn">Play Again</button> <!-- Button to restart from the modal -->
    </div>
    
    <main>
        <!-- Top Toolbar for changing game modes and visual themes -->
        <header class="toolbar">
            
            <!-- Selector to toggle between playing against another player (PvP) or the computer (PvE) -->
            <div class="mode-selector">
                <select id="game-mode">
                    <option value="pvp">🧑‍🤝‍🧑 vs Player (PvP)</option>
                    <option value="pve">🤖 vs Computer (Bot)</option>
                </select>
            </div>
            
            <!-- Toggle switch for Light / Dark Mode -->
            <div class="theme-switch">
                <span id="theme-label">Dark Mode</span> <!-- Dynamically updates to show current mode -->
                <label class="switch">
                    <!-- Checkbox backing the custom slider UI -->
                    <input type="checkbox" id="theme-toggle">
                    <span class="slider round"></span>
                </label>
            </div>
            
        </header>

        <!-- Main Title -->
        <h1 id="hading">Tic Tac Toe</h1>
        
        <!-- Game Board Container -->
        <div class="content">
            <div class="game">
                <!-- 9 clickable buttons representing the 3x3 game board -->
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
                <button class="box"></button>
            </div>
        </div>
        
        <!-- Button beneath the board to clear it mid-game -->
        <button id="Reset-btn">Reset Board</button>
    </main>
    
    <!-- Link to external JavaScript handling game logic -->
    <script src="app.js"></script>
</body>
</html>
